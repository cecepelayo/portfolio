<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cecemellaman — Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="cursor"></div>

<header id="header">
  <a href="index.html" class="logo"><img src="img/logo_portfolio.png" alt=""></a>
  <nav>
    <a href="index.html" class="nav-active">Inicio</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="personal.html">Personal</a>
    <a href="contacto.html">Contacto</a>
  </nav>
  <button id="hamburger" aria-label="Menú" onclick="toggleDrawer()">
    <span></span><span></span><span></span>
  </button>
</header>

<div id="drawer">
  <a href="index.html">Inicio</a>
  <a href="portfolio.html">Portfolio</a>
  <a href="personal.html">Personal</a>
  <a href="contacto.html">Contacto</a>
</div>

<!-- Modal -->
<div id="modal" onclick="closeModal(event)">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-slider">
      <div class="slider-track" id="slider-track"></div>
      <div class="slider-thumbs" id="slider-thumbs"></div>
      <div class="slider-counter" id="slider-counter">1 / 1</div>
      <button class="slider-btn prev" id="slider-prev" onclick="slideBy(-1)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4L6 8l4 4"/></svg>
      </button>
      <button class="slider-btn next" id="slider-next" onclick="slideBy(1)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
      </button>
    </div>
    <div class="modal-info">
      <p class="modal-tag" id="modal-tag"></p>
      <h2 class="modal-title serif" id="modal-title"></h2>
      <div class="modal-divider"></div>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="modal-meta-grid" id="modal-meta-grid"></div>
    </div>
  </div>
</div>

<main>
  <section class="section" style="padding-top: 8rem;">
    <p class="section-label">Trabajo seleccionado</p>
    <h2 class="section-title serif" style="margin-bottom:3rem;">Portfolio</h2>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">Todo</button>
      <button class="filter-btn" data-filter="editorial">Diseño Editorial</button>
      <button class="filter-btn" data-filter="ilustracion">Ilustración</button>
      <button class="filter-btn" data-filter="branding">Diseño 3D</button>
    </div>

    <div class="projects-grid" id="projects-grid">

      <!-- Proyecto 1 -->
      <div class="project-card" data-cat="editorial"
           data-title="En el ojo del artista"
           data-tag="Diseño Editorial · 24/25"
           data-desc="Para este proyecto se presenta una exposición dedicada a Neil Leifer, uno de los fotógrafos más influyentes en la historia del deporte.

La exposición busca ofrecer una experiencia inmersiva que resalte su legado a través de un diseño gráfico cohesivo y una identidad visual impactante. Para ello, se han desarrollado los elementos clave de la muestra, incluyendo la señáletica, el catálogo y otros materiales editoriales que complementan la narrativa expositiva."
           data-images="img/Baner Free Mockup copia.png|img/Free Vertical Billboard on th Brick Wall Mockup copia.png|img/neil.png|img/portada_mockup.png|img/sala_museo.png|img/sala_museo2.png|img/sala_principal.png|img/squarecard.png|img/tickets_mockup.png|img/vistaarea_mockup.png"
           data-year="2024" data-role="Diseño productos editoriales" data-tools="InDesign, Illustrator, Photoshop" data-client="UDIT"
           onclick="openModal(this)">
        <img src="img/Neil.Leifer46.png" alt="UDIT" loading="lazy" />
        <div class="project-placeholder"></div>
        <div class="project-overlay">
          <div class="project-meta">
            <h3 class="serif">Productos Editoriales</h3>
            <span>Editorial · 2024</span>
          </div>
        </div>
      </div>

      <!-- Proyecto 2 -->
      <div class="project-card" data-cat="branding"
           data-title="Cháchara"
           data-tag="Branding · 2023"
           data-desc="Creación de una marca de vinos valenciana con enfoque en sostenibilidad y producción orgánica. El diseño de identidad visual se basa en la idea de conversación y comunidad, reflejada en el logotipo y las ilustraciones de las etiquetas."
           data-images="img/tinto.png|img/blanco.png|img/rosado.png|img/copy.png"
           data-year="2023" data-role="Branding & Identidad" data-tools="Illustrator, Photoshop" data-client="UDIT"
           onclick="openModal(this)">
        <img src="img/chachara.png" alt="Cháchara" loading="lazy" />
        <div class="project-placeholder"></div>
        <div class="project-overlay">
          <div class="project-meta">
            <h3 class="serif">Branding y etiquetado</h3>
            <span>Branding · 2023</span>
          </div>
        </div>
      </div>

      <!-- Proyecto 3 -->
      <div class="project-card" data-cat="ilustracion"
           data-title="Cata la Lata 2026 | 8ª Edición"
           data-tag="Ilustración · 2026"
           data-desc="Diseño de packaging para una trilogía de conservas premium: atún, sardinillas y mejillones en escabeche. El proyecto apuesta por el valor de la ilustración personalizada para vestir cada lata, transformando un producto cotidiano en una pieza visual única."
           data-images="img/CATA_LATA.jpg|img/mockup_atun.jpg|img/mockup_sardinillas.jpg|img/mockup_mejillones.jpg"
           data-year="2026" data-role="Ilustración" data-tools="Procreate, Photoshop e Illustrator" data-client="Cata la lata // UDIT"
           onclick="openModal(this)">
        <img src="img/CATA_LATA.jpg" alt="Cata la lata" loading="lazy" />
        <div class="project-placeholder"></div>
        <div class="project-overlay">
          <div class="project-meta">
            <h3 class="serif">Diseño de Packaging</h3>
            <span>Ilustración · 2026</span>
          </div>
        </div>
      </div>

      <!-- Proyecto 4 — Black Sheep -->
      <div class="project-card" data-cat="branding"
           data-title="Black Sheep — Iced Coffee"
           data-tag="Modelado 3D · 2026"
           data-desc="Exploración de packaging tridimensional para una línea de café helado de specialty. El concepto visual gira alrededor de la contracultura del café: rechazo a lo genérico, apuesta por la singularidad. Modelado y texturizado en Cinema 4D, render final con iluminación de estudio HDRI."
           data-images="img/lata_classic copia.jpg|img/Pelayo.Cecilia_3.2_Lata2.png|img/Pelayo.Cecilia_3.2_Lata3.png"
           data-year="2026" data-role="3D & Art Direction" data-tools="Cinema 4D, Photoshop" data-client="Black Sheep Coffee"
           onclick="openModal(this)">
        <img src="img/lata_classic copia.jpg" alt="Black Sheep Iced Coffee" loading="lazy" />
        <div class="project-placeholder"></div>
        <div class="project-overlay">
          <div class="project-meta">
            <h3 class="serif">Black Sheep · Iced Coffee</h3>
            <span>Modelado 3D · 2026</span>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<script src="JS/javascript.js"></script>
</body>
</html>
