<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <link rel="icon" href="img/logo_portfolio.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Italianno&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Particles.js CSS (opcional) -->
    <style>
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
    </style>

    <title>Contact</title>
</head>
<body>
    <!-- NAVIGATION BOOTSTRAP -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo_portfolio.png" alt="home" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">ABOUT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="projects.html">PROJECTS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">CONTACT</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Espaciador para compensar navbar fixed -->
    <div style="height: 70px;"></div>

    <div class="wrapper">
        <section id="Contact" class="contact-container">
            <!-- Particles.js background -->
            <div id="particles-js"></div>
            
            <div class="contenedor2">
                <div class="text">
                    <h1>Contact Me</h1>
                    <p>Feel free to reach out for collaborations or just a chat.</p>
                    <div class="rss">
                        <p>Follow me on:</p>
                        <ul>
                            <li><a href="https://www.instagram.com/cecemellaman/">Instagram: @cecemellaman</a></li>
                            <li><a href="https://es.linkedin.com/in/cecilia-pr85a">LinkedIn: linkedin.com/in/cecilia-pr85a</a></li>
                            <li><a href="https://workspace.google.com/intl/es/gmail/">Email: cecilia.pelayorodriguez@gmail.com</a></li>
                        </ul>
                    </div>
                </div>

                <div class="formulario">
                    <form>
                        <h2>Contact me</h2>
            
                        <div class="input-group">
                            <label for="name">Name</label>
                            <input type="text" name="name" id="name" placeholder="Name">
            
                            <label for="Number">Number</label>
                            <input type="num" name="Number" id="Number" placeholder="Number">
            
                            <label for="email">Email</label>
                            <input type="email" name="email" id="email" placeholder="Email">
            
                            <label for="comment">Comment</label>
                            <textarea name="comment" id="comment" cols="20" rows="5" placeholder="Comment"></textarea>
            
                            <input class="btn" type="submit" value="Submit">
                        </div>
                    </form>
                </div>
            </div>
            <!-- <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d6071.640502249657!2d-3.6698726!3d40.4571152!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd4229298050cad9%3A0x56b219c8b5ac9955!2sAv.%20de%20Alfonso%20XIII%2C%2097%2C%20Chamart%C3%ADn%2C%2028016%20Madrid!5e0!3m2!1ses!2ses!4v1713095287138!5m2!1ses!2ses" width="100%" height="600" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div> -->
        </section>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Configuración de Particles.js
        particlesJS('particles-js', {
            particles: {
                number: {
                    value: 80,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: '#667eea'
                },
                shape: {
                    type: 'circle',
                    stroke: {
                        width: 0,
                        color: '#000000'
                    }
                },
                opacity: {
                    value: 0.5,
                    random: false,
                    anim: {
                        enable: false,
                        speed: 1,
                        opacity_min: 0.1,
                        sync: false
                    }
                },
                size: {
                    value: 3,
                    random: true,
                    anim: {
                        enable: false,
                        speed: 40,
                        size_min: 0.1,
                        sync: false
                    }
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#667eea',
                    opacity: 0.4,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'none',
                    random: false,
                    straight: false,
                    out_mode: 'out',
                    bounce: false,
                    attract: {
                        enable: false,
                        rotateX: 600,
                        rotateY: 1200
                    }
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: {
                        enable: true,
                        mode: 'grab'
                    },
                    onclick: {
                        enable: true,
                        mode: 'push'
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 140,
                        line_linked: {
                            opacity: 1
                        }
                    },
                    push: {
                        particles_nb: 4
                    }
                }
            },
            retina_detect: true
        });
    </script>
    
</body>
</html>
